<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram Pending Requests</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        text-align: center;
        padding: 40px 20px;
    }

    .container {
        max-width: 600px;
        margin: auto;
    }

    h1 {
        margin-bottom: 10px;
    }

    p {
        color: #aaa;
    }

    textarea {
        width: 100%;
        height: 300px;
        padding: 15px;
        box-sizing: border-box;
        background: #222;
        color: white;
        border: 1px solid #444;
        border-radius: 12px;
        font-size: 15px;
        resize: vertical;
    }

    button {
        width: 100%;
        padding: 16px;
        margin-top: 15px;
        border: none;
        border-radius: 12px;
        background: #0095f6;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #0077cc;
    }

    #status {
        margin-top: 20px;
        color: #aaa;
        font-size: 15px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>Instagram Pending Requests</h1>

    <p>
        Paste your usernames below, one per line.
    </p>

    <textarea id="usernames"
        placeholder="username1
username2
username3"></textarea>

    <button onclick="openNext()">
        Open Next
    </button>

    <button onclick="resetProgress()">
        Reset Progress
    </button>

    <div id="status"></div>

</div>

<script>

let currentIndex =
    Number(localStorage.getItem("instagramIndex")) || 0;


function getUsernames() {

    return document
        .getElementById("usernames")
        .value
        .split(/\r?\n/)
        .map(username => username.trim())
        .map(username => username.replace(/^@/, ""))
        .filter(username => username.length > 0);

}


function openNext() {

    const usernames = getUsernames();

    if (usernames.length === 0) {

        alert("Paste your usernames first.");

        return;
    }


    if (currentIndex >= usernames.length) {

        alert("You've reached the end of the list!");

        return;
    }


    const username = usernames[currentIndex];


    const instagramURL =
        "https://www.instagram.com/" +
        encodeURIComponent(username) +
        "/";


    window.open(instagramURL, "_blank");


    currentIndex++;


    localStorage.setItem(
        "instagramIndex",
        currentIndex
    );


    updateStatus();

}


function resetProgress() {

    currentIndex = 0;

    localStorage.setItem(
        "instagramIndex",
        "0"
    );

    updateStatus();

}


function updateStatus() {

    const usernames = getUsernames();

    document.getElementById("status").textContent =
        "Next: " +
        currentIndex +
        " / " +
        usernames.length;

}


document
    .getElementById("usernames")
    .addEventListener("input", updateStatus);


updateStatus();

</script>

</body>
</html>
