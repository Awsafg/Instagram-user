<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Batch Opener</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    padding: 30px;
    max-width: 800px;
    margin: auto;
}

h1 {
    text-align: center;
}

textarea {
    width: 100%;
    height: 250px;
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 10px;
    padding: 15px;
    font-size: 15px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: #0095f6;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0077cc;
}

#status {
    margin-top: 20px;
    text-align: center;
    color: #aaa;
}
</style>
</head>

<body>

<h1>Instagram Pending Requests</h1>

<p>
Paste your usernames below, one username per line.
</p>

<textarea id="usernames" placeholder="username1
username2
username3"></textarea>

<button onclick="openBatch(20)">
Open Next 20
</button>

<button onclick="openBatch(50)">
Open Next 50
</button>

<button onclick="resetProgress()">
Reset Progress
</button>

<div id="status"></div>

<script>

let currentIndex = Number(localStorage.getItem("instagramIndex")) || 0;

function getUsernames() {

    return document.getElementById("usernames")
        .value
        .split(/\r?\n/)
        .map(x => x.trim())
        .map(x => x.replace(/^@/, ""))
        .filter(x => x.length > 0);

}

function openBatch(amount) {

    const usernames = getUsernames();

    if (usernames.length === 0) {
        alert("Paste your usernames first.");
        return;
    }

    if (currentIndex >= usernames.length) {
        alert("You've reached the end of the list.");
        return;
    }

    const end = Math.min(
        currentIndex + amount,
        usernames.length
    );

    const batch = usernames.slice(
        currentIndex,
        end
    );

    batch.forEach(username => {

        const url =
            "https://www.instagram.com/" +
            encodeURIComponent(username) +
            "/";

        window.open(url, "_blank");

    });

    currentIndex = end;

    localStorage.setItem(
        "instagramIndex",
        currentIndex
    );

    updateStatus();

}

function resetProgress() {

    currentIndex = 0;

    localStorage.setItem(
        "instagramIndex",
        "0"
    );

    updateStatus();

}

function updateStatus() {

    const usernames = getUsernames();

    document.getElementById("status").innerText =
        "Progress: " +
        currentIndex +
        " / " +
        usernames.length;

}

document
    .getElementById("usernames")
    .addEventListener("input", updateStatus);

updateStatus();

</script>

</body>
</html>
